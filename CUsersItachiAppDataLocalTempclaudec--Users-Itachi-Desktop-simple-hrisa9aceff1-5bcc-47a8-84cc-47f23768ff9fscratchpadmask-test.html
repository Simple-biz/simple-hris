<!DOCTYPE html>
<html>
<head>
<title>Mask Test</title>
<style>
@property --gen-angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

.test {
  position: relative;
  width: 200px;
  height: 200px;
  background: #f0f0f0;
  margin: 20px;
}

.border-run {
  position: absolute;
  inset: -2px;
  border-radius: 8px;
  padding: 2px;
  background: conic-gradient(from var(--gen-angle),
    transparent 0deg, transparent 250deg,
    #34d399 300deg, #39ff14 338deg, #d9ffcf 354deg, transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}
</style>
</head>
<body>
<div class="test">
  <div class="border-run"></div>
  <div style="position: absolute; inset: 0; background: white; border-radius: 8px;"></div>
  <p style="position: relative; padding: 20px;">Content</p>
</div>
</body>
</html>
